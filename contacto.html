<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto – Yeremi S. BΛSTIAN</title>
  <meta name="description" content="Escríbeme para colaboraciones, proyectos o consultas." />
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="estilos.css">
  <style>
    main {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin-bottom: 0.75rem;
    }

    .lead {
      font-size: 1.05rem;
      margin-bottom: 2rem;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.6;
    }

    form {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--surface);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(67, 209, 122, 0.2);
      text-align: left;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: -0.5rem;
    }

    input, textarea {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #1b211b;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
    }

    button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: var(--accent-dark);
    }

    #respuesta {
      margin-top: 1rem;
      color: #43d17a;
      display: none;
    }

    .directo {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .directo a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <header>
    <a href="index.html">Inicio</a>
    <a href="portafolio.html">Portafolio</a>
    <a class="active" href="contacto.html">Contacto</a>
  </header>

  <main>
    <h1>Hablemos</h1>
    <p class="lead">¿Tienes una idea, un proyecto o solo quieres saludar? Estoy a un mensaje de distancia.</p>

    <form id="formulario" action="https://formspree.io/f/manbergg" method="POST">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" type="text" name="nombre" placeholder="Tu nombre" autocomplete="name" required>

      <label for="correo">Tu correo</label>
      <input id="correo" type="email" name="correo" placeholder="tu@correo.com" autocomplete="email" required>

      <label for="mensaje">Tu mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntame qué tienes en mente..." required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <p id="respuesta" role="status" aria-live="polite">¡Mensaje enviado con éxito!</p>

    <p class="directo">
      También puedes escribirme directo por
      <a href="https://www.instagram.com/yeremi.sbastian/" target="_blank" rel="noopener noreferrer">Instagram</a>.
    </p>
  </main>

  <footer>
    © Yeremi S. BΛSTIAN — 2026 · Estoy leyendo tus mensajes... 👀
  </footer>

  <script src="cursor.js"></script>
  <script>
    const form = document.getElementById('formulario');
    const respuesta = document.getElementById('respuesta');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      })
        .then(function (response) {
          if (response.ok) {
            respuesta.style.display = 'block';
            respuesta.style.color = '#43d17a';
            form.reset();
          } else {
            respuesta.innerText = 'Ocurrió un error. Intenta de nuevo o escríbeme por Instagram.';
            respuesta.style.color = '#43d17a';
            respuesta.style.display = 'block';
          }
        })
        .catch(function () {
          respuesta.innerText = 'Sin conexión. Revisa tu internet e intenta otra vez.';
          respuesta.style.color = '#43d17a';
          respuesta.style.display = 'block';
        });
    });
  </script>
</body>
</html>
