<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto – Yeremi S. BΛSTIAN</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0d0d;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease;
    }

    header {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 1.5rem;
      font-size: 1rem;
    }

    header a {
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      position: relative;
    }

    header a:hover,
    header a.active {
      color: #ff2e2e;
    }

    header a.active::after,
    header a:hover::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 2px;
      background: #ff2e2e;
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #ccc;
    }

    form {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 46, 46, 0.2);
    }

    input, textarea {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid #ff2e2e;
    }

    button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #ff2e2e;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #e02222;
    }

    #respuesta {
      margin-top: 1rem;
      color: #00ff88;
      display: none;
    }

    footer {
      font-size: 0.8rem;
      color: #aaa;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>

  <header>
    <a href="index.html">Inicio</a>
    <a href="portafolio.html">Portafolio</a>
    <a class="active" href="contacto.html">Contacto</a>
  </header>

  <main>
    <h1>Hablemos</h1>
    <p>¿Tienes alguna idea, proyecto o solo quieres saludar? Estoy a un mensaje de distancia.</p>
    <form id="formulario" action="https://formspree.io/f/manbergg" method="POST">
      <input type="text" name="nombre" placeholder="Tu nombre" required>
      <input type="email" name="correo" placeholder="Tu correo electrónico" required>
      <textarea name="mensaje" rows="5" placeholder="Tu mensaje..." required></textarea>
      <button type="submit">Enviar</button>
    </form>
    <div id="respuesta">¡Mensaje enviado con éxito!</div>
  </main>

  <footer>
    © Yeremi 2025 - Estoy leyendo tus mensajes... 👀
  </footer>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.top = `${e.clientY}px`;
      cursor.style.left = `${e.clientX}px`;
    });

    const form = document.getElementById('formulario');
    const respuesta = document.getElementById('respuesta');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(form);
      fetch(form.action, {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          respuesta.style.display = 'block';
          respuesta.style.color = '#00ff88';
          form.reset();
        } else {
          respuesta.innerText = 'Ocurrió un error...';
          respuesta.style.color = '#ff2e2e';
          respuesta.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
